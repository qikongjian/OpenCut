<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频字幕编辑器 - 硬字幕版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px dashed #dee2e6;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .preview-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .video-container {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .subtitle-overlay {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 18px;
            text-align: center;
            min-width: 80%;
            backdrop-filter: blur(10px);
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .subtitle-editor {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .subtitle-editor h3 {
            margin-bottom: 15px;
            color: #495057;
        }

        .subtitle-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .subtitle-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .time-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .input-group input {
            padding: 8px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.4);
        }

        .controls {
            text-align: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #dee2e6;
        }

        .export-btn {
            padding: 15px 50px;
            font-size: 18px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .export-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 10px;
            margin-top: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .timeline {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .timeline-bar {
            height: 60px;
            background: #e9ecef;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            margin: 20px 0;
        }

        .subtitle-block {
            position: absolute;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.8;
        }

        .subtitle-block:hover {
            opacity: 1;
            transform: scaleY(1.1);
        }

        .time-display {
            text-align: center;
            color: #6c757d;
            margin-top: 10px;
        }

        .init-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 视频字幕编辑器 - 硬字幕版</h1>
        
        <div class="init-message" id="initMessage">
            ⏳ 正在加载 FFmpeg，首次加载可能需要 1-2 分钟...
        </div>

        <div class="upload-section" style="display: none;" id="uploadSection">
            <div class="file-input-wrapper">
                <input type="file" id="videoInput" accept="video/*">
                <label for="videoInput" class="file-input-label">
                    📁 选择视频文件
                </label>
            </div>
        </div>

        <div class="preview-section" style="display: none;" id="editorSection">
            <div class="video-container">
                <video id="videoPlayer" controls></video>
                <div class="subtitle-overlay" id="subtitleOverlay"></div>
            </div>
            
            <div class="subtitle-editor">
                <h3>字幕编辑</h3>
                <div id="subtitlesList"></div>
                <button class="btn btn-primary" onclick="addSubtitle()">➕ 添加字幕</button>
            </div>
        </div>

        <div class="timeline" id="timeline" style="display: none;">
            <h3>时间轴</h3>
            <div class="timeline-bar" id="timelineBar"></div>
            <div class="time-display">
                <span id="currentTime">00:00</span> / <span id="duration">00:00</span>
            </div>
        </div>

        <div class="controls" id="exportSection" style="display: none;">
            <button class="btn export-btn" id="exportBtn" onclick="exportVideo()">
                🎥 导出带字幕的视频
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p id="loadingText">正在处理视频，请稍候...</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <p><small id="loadingDetail">初始化中...</small></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.11.1/dist/index.js"></script>
    <script>
        let videoFile = null;
        let subtitles = [];
        let videoDuration = 0;
        let ffmpeg = null;
        let ffmpegLoaded = false;

        // 初始化 FFmpeg
        async function initFFmpeg() {
            const { createFFmpeg, fetchFile } = FFmpeg;
            
            ffmpeg = createFFmpeg({
                log: true,
                progress: ({ ratio }) => {
                    const percent = Math.min(Math.round(ratio * 100), 100);
                    document.getElementById('progressBar').style.width = percent + '%';
                    document.getElementById('loadingDetail').textContent = `处理进度: ${percent}%`;
                },
                corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
            });

            try {
                await ffmpeg.load();
                
                ffmpegLoaded = true;
                document.getElementById('initMessage').style.display = 'none';
                document.getElementById('uploadSection').style.display = 'block';
                console.log('FFmpeg 加载成功');
            } catch (error) {
                console.error('FFmpeg 加载失败:', error);
                document.getElementById('initMessage').innerHTML = '❌ FFmpeg 加载失败，请刷新页面重试';
            }
        }

        // 页面加载时初始化 FFmpeg
        window.addEventListener('load', initFFmpeg);

        document.getElementById('videoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('video/')) {
                videoFile = file;
                loadVideo(file);
            }
        });

        function loadVideo(file) {
            const video = document.getElementById('videoPlayer');
            const url = URL.createObjectURL(file);
            video.src = url;
            
            video.addEventListener('loadedmetadata', function() {
                videoDuration = video.duration;
                document.getElementById('editorSection').style.display = 'grid';
                document.getElementById('timeline').style.display = 'block';
                document.getElementById('exportSection').style.display = 'block';
                updateTimeline();
                updateDurationDisplay();
                
                // 添加默认字幕
                addSubtitle();
            });

            video.addEventListener('timeupdate', updateSubtitleDisplay);
            video.addEventListener('timeupdate', updateCurrentTimeDisplay);
        }

        function addSubtitle() {
            const id = Date.now();
            const subtitle = {
                id: id,
                startTime: subtitles.length * 5,
                endTime: (subtitles.length + 1) * 5,
                text: '请输入字幕文本'
            };
            subtitles.push(subtitle);
            renderSubtitles();
            updateTimeline();
        }

        function renderSubtitles() {
            const container = document.getElementById('subtitlesList');
            container.innerHTML = '';
            
            subtitles.forEach((subtitle, index) => {
                const div = document.createElement('div');
                div.className = 'subtitle-item';
                div.innerHTML = `
                    <div class="time-inputs">
                        <div class="input-group">
                            <label>开始时间 (秒)</label>
                            <input type="number" 
                                   value="${subtitle.startTime}" 
                                   min="0" 
                                   step="0.1"
                                   onchange="updateSubtitle(${subtitle.id}, 'startTime', this.value)">
                        </div>
                        <div class="input-group">
                            <label>结束时间 (秒)</label>
                            <input type="number" 
                                   value="${subtitle.endTime}" 
                                   min="0" 
                                   step="0.1"
                                   onchange="updateSubtitle(${subtitle.id}, 'endTime', this.value)">
                        </div>
                    </div>
                    <textarea placeholder="输入字幕文本..." 
                              onchange="updateSubtitle(${subtitle.id}, 'text', this.value)">${subtitle.text}</textarea>
                    <button class="btn btn-danger" onclick="deleteSubtitle(${subtitle.id})">删除</button>
                `;
                container.appendChild(div);
            });
        }

        function updateSubtitle(id, field, value) {
            const subtitle = subtitles.find(s => s.id === id);
            if (subtitle) {
                if (field === 'startTime' || field === 'endTime') {
                    subtitle[field] = parseFloat(value);
                } else {
                    subtitle[field] = value;
                }
                updateTimeline();
            }
        }

        function deleteSubtitle(id) {
            subtitles = subtitles.filter(s => s.id !== id);
            renderSubtitles();
            updateTimeline();
        }

        function updateSubtitleDisplay() {
            const video = document.getElementById('videoPlayer');
            const overlay = document.getElementById('subtitleOverlay');
            const currentTime = video.currentTime;
            
            const currentSubtitle = subtitles.find(s => 
                currentTime >= s.startTime && currentTime <= s.endTime
            );
            
            if (currentSubtitle) {
                overlay.textContent = currentSubtitle.text;
                overlay.style.display = 'block';
            } else {
                overlay.style.display = 'none';
            }
        }

        function updateTimeline() {
            const bar = document.getElementById('timelineBar');
            bar.innerHTML = '';
            
            if (videoDuration === 0) return;
            
            subtitles.forEach(subtitle => {
                const block = document.createElement('div');
                block.className = 'subtitle-block';
                const left = (subtitle.startTime / videoDuration) * 100;
                const width = ((subtitle.endTime - subtitle.startTime) / videoDuration) * 100;
                block.style.left = `${left}%`;
                block.style.width = `${width}%`;
                block.textContent = subtitle.text.substring(0, 20) + (subtitle.text.length > 20 ? '...' : '');
                block.onclick = () => {
                    document.getElementById('videoPlayer').currentTime = subtitle.startTime;
                };
                bar.appendChild(block);
            });
        }

        function updateCurrentTimeDisplay() {
            const video = document.getElementById('videoPlayer');
            document.getElementById('currentTime').textContent = formatTime(video.currentTime);
        }

        function updateDurationDisplay() {
            document.getElementById('duration').textContent = formatTime(videoDuration);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function generateASS() {
            let ass = `[Script Info]
Title: Subtitles
ScriptType: v4.00+
PlayResX: 1920
PlayResY: 1080

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
Style: Default,Arial,48,&H00FFFFFF,&H000000FF,&H00000000,&H80000000,0,0,0,0,100,100,0,0,1,2,1,2,10,10,50,1

[Events]
Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n`;

            subtitles.forEach(subtitle => {
                const start = formatASSTime(subtitle.startTime);
                const end = formatASSTime(subtitle.endTime);
                ass += `Dialogue: 0,${start},${end},Default,,0,0,0,,${subtitle.text}\n`;
            });
            
            return ass;
        }

        function formatASSTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            const cs = Math.floor((seconds % 1) * 100);
            return `${hours}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${cs.toString().padStart(2, '0')}`;
        }

        async function exportVideo() {
            if (!videoFile || subtitles.length === 0) {
                alert('请先上传视频并添加字幕');
                return;
            }

            if (!ffmpegLoaded) {
                alert('FFmpeg 还在加载中，请稍后再试');
                return;
            }

            const loading = document.getElementById('loading');
            const exportBtn = document.getElementById('exportBtn');
            loading.classList.add('active');
            exportBtn.disabled = true;

            try {
                const { fetchFile } = FFmpeg;
                
                // 重置进度条
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('loadingText').textContent = '正在准备视频文件...';
                document.getElementById('loadingDetail').textContent = '读取视频数据...';

                // 写入视频文件到 FFmpeg 文件系统
                const videoData = await fetchFile(videoFile);
                ffmpeg.FS('writeFile', 'input.mp4', videoData);
                
                // 生成 ASS 字幕文件（ASS 格式支持更好的样式）
                document.getElementById('loadingDetail').textContent = '生成字幕文件...';
                const assContent = generateASS();
                const encoder = new TextEncoder();
                const assData = encoder.encode(assContent);
                ffmpeg.FS('writeFile', 'subtitles.ass', assData);
                
                // 使用 FFmpeg 合并视频和字幕
                document.getElementById('loadingText').textContent = '正在合并视频和字幕...';
                document.getElementById('loadingDetail').textContent = '这可能需要几分钟，请耐心等待...';
                
                // 执行 FFmpeg 命令，使用 subtitles 滤镜硬编码字幕
                await ffmpeg.run(
                    '-i', 'input.mp4',
                    '-vf', `ass=subtitles.ass`,
                    '-c:a', 'copy',
                    '-preset', 'fast',
                    'output.mp4'
                );
                
                // 读取输出文件
                document.getElementById('loadingText').textContent = '正在生成下载文件...';
                document.getElementById('loadingDetail').textContent = '准备下载...';
                const data = ffmpeg.FS('readFile', 'output.mp4');
                
                // 创建下载链接
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `video_with_subtitles_${Date.now()}.mp4`;
                a.click();
                
                // 清理文件系统
                ffmpeg.FS('unlink', 'input.mp4');
                ffmpeg.FS('unlink', 'subtitles.ass');
                ffmpeg.FS('unlink', 'output.mp4');
                
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('loadingText').textContent = '✅ 导出成功！';
                document.getElementById('loadingDetail').textContent = '视频已开始下载';
                
                setTimeout(() => {
                    loading.classList.remove('active');
                    URL.revokeObjectURL(url);
                }, 2000);
                
            } catch (error) {
                console.error('导出失败:', error);
                alert('导出失败: ' + error.message + '\n\n请确保浏览器支持 SharedArrayBuffer，或尝试使用 Chrome/Edge 浏览器。');
                loading.classList.remove('active');
            } finally {
                exportBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
